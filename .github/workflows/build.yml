name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore "TS SE Tool.sln"

      - name: Build Release Any CPU
        run: msbuild "TS SE Tool.sln" /t:Rebuild /m /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ts-se-tool-community-${{ github.sha }}
          path: |
            TS SE Tool/bin/Release/**
          if-no-files-found: error
