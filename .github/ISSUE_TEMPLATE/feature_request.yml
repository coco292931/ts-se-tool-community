name: Solicitar um recurso
description: Proponha uma melhoria segura e testável
title: "[Recurso]: "
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema do usuário
    validations:
      required: true
  - type: textarea
    id: comportamento
    attributes:
      label: Comportamento proposto
    validations:
      required: true
  - type: textarea
    id: blocos
    attributes:
      label: Blocos e referências do save afetados
      description: Explique o impacto esperado no grafo e como ele pode ser validado.
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências de teste disponíveis
