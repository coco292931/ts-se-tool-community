name: Relatar um erro
description: Informe um problema reproduzível no Euro Truck Simulator 2
title: "[Erro]: "
labels: [bug, needs-triage]
body:
  - type: checkboxes
    id: seguranca
    attributes:
      label: Lista de segurança
      options:
        - label: Testei em uma cópia de save manual com o jogo fechado.
          required: true
        - label: Fiz apenas uma alteração isolada.
          required: true
        - label: Removi dados pessoais dos anexos.
          required: true
  - type: input
    id: versao_programa
    attributes:
      label: Versão do TS SE Tool
      placeholder: 0.3.11.47
    validations:
      required: true
  - type: input
    id: versao_jogo
    attributes:
      label: Versão do ETS2 e formato do save
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: resultado
    attributes:
      label: Resultado esperado e resultado obtido
    validations:
      required: true
  - type: textarea
    id: dlcs_mods
    attributes:
      label: DLCs e mods relevantes para o teste
  - type: textarea
    id: evidencias
    attributes:
      label: Logs e diff
      description: Anexe log.log, errorlog.log, compatibility.log e um diff mínimo anonimizado.
    validations:
      required: true
