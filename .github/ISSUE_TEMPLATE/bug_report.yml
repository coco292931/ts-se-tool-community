name: Relatar problema
description: Informe um problema reproduzível no ETS2 usando uma cópia de save manual.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        A versão 0.3.11.47 foi testada e validada no Euro Truck Simulator 2 1.60 com save de formato 97. Para versões diferentes, informe todos os detalhes e mantenha um backup.
  - type: checkboxes
    id: safety
    attributes:
      label: Verificações de segurança
      options:
        - label: Testei em uma cópia de save manual com o jogo fechado.
          required: true
        - label: Fiz apenas uma alteração isolada.
          required: true
        - label: Removi informações pessoais dos anexos.
          required: true
  - type: input
    id: tool_version
    attributes:
      label: Versão do TS SE Tool
      placeholder: 0.3.11.47
    validations:
      required: true
  - type: input
    id: ets2_version
    attributes:
      label: Versão do ETS2
      description: A versão homologada nesta release é a 1.60.
      placeholder: 1.60
    validations:
      required: true
  - type: input
    id: save_format
    attributes:
      label: Formato do save
      description: O formato validado nesta release é o 97.
      placeholder: 97
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Resultado esperado e resultado obtido
    validations:
      required: true
  - type: textarea
    id: dlcs_mods
    attributes:
      label: DLCs e mods relevantes
  - type: textarea
    id: evidence
    attributes:
      label: Logs e diff
      description: Anexe log.log, errorlog.log, compatibility.log e um diff mínimo anonimizado.
    validations:
      required: true